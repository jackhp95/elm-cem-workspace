<!-- Task C6, Step 1 + 4: the human review UI. Vanilla HTML/CSS/JS, zero
     deps, zero build step — server.mjs serves this file byte-for-byte at
     GET /. Talks to the server ONLY via the four routes server.test.mjs
     already exercises programmatically: GET /api/queue, GET /api/image, and
     POST /api/{approve,reject,retarget}. Every action posts and re-renders
     immediately (no bulk "save" button anywhere — the brief's "no
     bulk-save to lose" requirement is a server-side fact, not just a UI
     convention, but the UI shouldn't invite the human to batch up decisions
     either). -->
<title>Visual gate review — cem-figma-connect</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 1.5rem;
    max-width: 72rem;
    margin-inline: auto;
  }
  h1 { font-size: 1.25rem; }
  #summary { color: #666; margin-bottom: 1rem; }
  #empty { padding: 2rem 0; color: #666; }
  .item {
    border: 1px solid rgba(128, 128, 128, 0.35);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .item h2 { margin: 0 0 0.25rem; font-size: 1.05rem; font-family: ui-monospace, monospace; }
  .meta { font-size: 0.85rem; color: #666; margin-bottom: 0.75rem; }
  .meta span { margin-right: 1rem; }
  .rationale { font-size: 0.85rem; margin-bottom: 0.75rem; white-space: pre-wrap; }
  .images { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .images figure { margin: 0; text-align: center; }
  .images img {
    max-width: 220px;
    max-height: 220px;
    background:
      linear-gradient(45deg, #8884 25%, transparent 25%, transparent 75%, #8884 75%) 0 0/16px 16px,
      linear-gradient(45deg, #8884 25%, transparent 25%, transparent 75%, #8884 75%) 8px 8px/16px 16px;
    border: 1px solid rgba(128, 128, 128, 0.35);
  }
  .images figcaption { font-size: 0.75rem; color: #666; }
  .actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .actions textarea {
    flex: 1 1 16rem;
    min-width: 12rem;
    min-height: 2.2rem;
    resize: vertical;
    font: inherit;
    font-size: 0.85rem;
  }
  button {
    font: inherit;
    padding: 0.4rem 0.9rem;
    border-radius: 6px;
    border: 1px solid rgba(128, 128, 128, 0.5);
    cursor: pointer;
    background: transparent;
    color: inherit;
  }
  button.approve { border-color: #2a8f2a; color: #2a8f2a; }
  button.reject { border-color: #b0342d; color: #b0342d; }
  button.retarget { border-color: #a08000; color: #a08000; }
  button:hover { filter: brightness(1.15); }
  .status-line { font-size: 0.8rem; margin-top: 0.4rem; min-height: 1em; }
</style>

<h1>Visual gate review</h1>
<div id="summary">Loading…</div>
<div id="empty" hidden>No pending failures — the gate is clean.</div>
<div id="list"></div>

<script>
  async function fetchQueue() {
    const res = await fetch("/api/queue");
    if (!res.ok) throw new Error(`GET /api/queue failed: ${res.status}`);
    return res.json();
  }

  async function postAction(action, cemTag, note) {
    const res = await fetch(`/api/${action}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ cemTag, note }),
    });
    if (!res.ok) throw new Error(`POST /api/${action} failed: ${res.status}`);
    return res.json();
  }

  function renderQueue(queue) {
    const summary = document.getElementById("summary");
    const empty = document.getElementById("empty");
    const list = document.getElementById("list");

    summary.textContent = queue.runId
      ? `${queue.items.length} pending failure(s) — run ${queue.runId}`
      : "No results run found yet.";

    list.innerHTML = "";
    empty.hidden = queue.items.length > 0;

    for (const item of queue.items) {
      list.appendChild(renderItem(item));
    }
  }

  function figureFor(label, src) {
    const fig = document.createElement("figure");
    const caption = document.createElement("figcaption");
    caption.textContent = label;
    const img = document.createElement("img");
    img.alt = label;
    if (src) img.src = src;
    fig.append(img, caption);
    return fig;
  }

  function renderItem(item) {
    const el = document.createElement("div");
    el.className = "item";

    const h2 = document.createElement("h2");
    h2.textContent = `${item.cemTag} — ${item.stateId}`;
    el.appendChild(h2);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML =
      `<span>kind: ${item.matcherKind}</span>` +
      `<span>diffRatio: ${item.diffRatio.toFixed(4)}</span>` +
      `<span>threshold: ${item.threshold}</span>`;
    el.appendChild(meta);

    const rationale = document.createElement("div");
    rationale.className = "rationale";
    rationale.textContent = item.rationale || "(no rationale recorded)";
    el.appendChild(rationale);

    const images = document.createElement("div");
    images.className = "images";
    images.append(
      figureFor("code", item.artifacts.code),
      figureFor("figma", item.artifacts.figma),
      figureFor("diff (toggle: click to compare code/figma)", item.artifacts.diff)
    );
    el.appendChild(images);

    // Diff-overlay toggle: clicking the diff image cycles code -> figma ->
    // diff, so a human can flip between them in place without scrolling.
    const diffImg = images.querySelectorAll("img")[2];
    const codeSrc = item.artifacts.code;
    const figmaSrc = item.artifacts.figma;
    const diffSrc = item.artifacts.diff;
    const cycle = [diffSrc, codeSrc, figmaSrc].filter(Boolean);
    let cycleIndex = 0;
    diffImg.style.cursor = "pointer";
    diffImg.addEventListener("click", () => {
      cycleIndex = (cycleIndex + 1) % cycle.length;
      diffImg.src = cycle[cycleIndex];
    });

    const actions = document.createElement("div");
    actions.className = "actions";

    const note = document.createElement("textarea");
    note.placeholder = "optional note (why approved / what to retarget)";
    actions.appendChild(note);

    const statusLine = document.createElement("div");
    statusLine.className = "status-line";

    function bindAction(label, action, className) {
      const button = document.createElement("button");
      button.textContent = label;
      button.className = className;
      button.addEventListener("click", async () => {
        button.disabled = true;
        statusLine.textContent = `${label}ing…`;
        try {
          const result = await postAction(action, item.cemTag, note.value || undefined);
          statusLine.textContent = `${item.cemTag}: ${result.gate}`;
          renderQueue(result.queue);
        } catch (err) {
          statusLine.textContent = `error: ${err.message}`;
          button.disabled = false;
        }
      });
      actions.appendChild(button);
    }

    bindAction("Approve", "approve", "approve");
    bindAction("Reject", "reject", "reject");
    bindAction("Retarget", "retarget", "retarget");

    el.appendChild(actions);
    el.appendChild(statusLine);

    return el;
  }

  fetchQueue()
    .then(renderQueue)
    .catch((err) => {
      document.getElementById("summary").textContent = `error loading queue: ${err.message}`;
    });
</script>
