name: CI

# MANUAL ONLY — `hooks/pre-push` runs this repo's gate locally before anything
# reaches origin, so re-running it here is a slower duplicate. Kept dispatchable
# for a clean-checkout or ubuntu-vs-macOS reproduction.
on:
  workflow_dispatch:

env:
  ELM_VERSION: "0.19.1"
  NODE_VERSION: "22"

jobs:
  ci:
    name: gate (format · review · validate · acid · whatwg · drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # elm-review-cem rules are not yet on the registry; pull them from the
      # public sibling repo. Must land at $GITHUB_WORKSPACE/../elm-review-cem
      # to match the source-directory in review/elm.json.
      - name: Fetch elm-review-cem (sibling)
        run: git clone --depth 1 https://github.com/jackhp95/elm-review-cem.git "$GITHUB_WORKSPACE/../elm-review-cem"

      # TypedHtml.Review.Facts (generated, in src/) references HtmlIr.* from
      # the IR package, which is also unpublished. Pull it as a sibling too.
      # PRIVATE repo — authenticated clone. ELM_CEM_TOKEN is a PAT (classic:
      # `repo` scope, or fine-grained: Contents:read) that can read the private
      # jackhp95 sibling repos; set it as a repo/org Actions secret.
      - name: Fetch elm-html-intermediate-representation (sibling, private)
        env:
          ELM_CEM_TOKEN: ${{ secrets.ELM_CEM_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${ELM_CEM_TOKEN}@github.com/jackhp95/elm-html-intermediate-representation.git" "$GITHUB_WORKSPACE/../elm-html-intermediate-representation"

      # check:drift (scripts/regen-diff-gate.sh) regenerates from the elm-cem
      # generator at ../elm-cem/bin/elm-cem.js (ELM_CEM_BIN) to prove src/ is
      # byte-identical to a clean regen. Added alongside the finding-1.8 fix
      # below (this step previously wasn't run by CI at all, only locally).
      # PRIVATE repo — authenticated clone (same ELM_CEM_TOKEN).
      - name: Fetch elm-cem generator (sibling, private)
        env:
          ELM_CEM_TOKEN: ${{ secrets.ELM_CEM_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${ELM_CEM_TOKEN}@github.com/jackhp95/elm-cem.git" "$GITHUB_WORKSPACE/../elm-cem"
          cd "$GITHUB_WORKSPACE/../elm-cem" && npm ci

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache elm-stuff
        uses: actions/cache@v4
        with:
          path: elm-stuff
          key: ${{ runner.os }}-elm-${{ env.ELM_VERSION }}-${{ hashFiles('elm.json') }}

      - name: Cache review elm-stuff
        uses: actions/cache@v4
        with:
          path: review/elm-stuff
          key: ${{ runner.os }}-elm-review-${{ hashFiles('review/elm.json', 'review/src/**/*.elm') }}

      - name: Install deps
        run: npm ci

      # One step, deliberately (finding 1.8 fix): `gate` = `npm run check`,
      # which is `run-p "check:*"` — every check:* script in package.json,
      # with no hand-enumerated subset to drift out of sync. This workflow
      # used to list four of the six check:* steps by hand and silently went
      # stale when check:whatwg and check:drift were added later. Enumerating
      # steps again here would let this file and package.json drift apart a
      # second time; `gate` is also what hooks/pre-push runs locally, so this
      # is the exact same contract, not a parallel one.
      - name: gate (check:format + check:review + check:validate + check:acid + check:whatwg + check:drift)
        run: npm run gate
