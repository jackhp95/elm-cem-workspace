name: CI

# Root workspace gate — fixes finding 1.1 (no root CI at all). This is the
# canonical, automatic enforcement point: it runs `node tools/gate-all.mjs`,
# "the ONE command that proves the whole workspace is green" (see that file's
# own header). Every per-package `.github/workflows/ci.yml` is manual-dispatch
# only and exists as a mirror-side backstop (see those files' own headers) —
# this is the workflow that actually runs on every push/PR against the
# monorepo, closing the gap documented in
# docs/plans/2026-08-17-standalone-repo-realignment.md (the 2026-08-12→17
# mirror-fork incident happened with no CI catching it).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  gate-all:
    name: gate-all (the whole workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.30.3"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Installs npm deps for every workspace package, then (via the root
      # `postinstall` -> tools/install-toolchains.mjs) runs `elm-tooling
      # install` for the root and for every package that ships its own
      # elm-tooling.json. See that script's header for why elm-cem and
      # elm-review-cem are intentionally excluded from that pass.
      - name: Install workspace deps (+ toolchains via postinstall)
        run: pnpm install --frozen-lockfile

      # Public repo, no auth needed — required by check-mirror-drift for the
      # names already recorded in tools/publish-mirror-state.json.
      - name: Point gh CLI at GITHUB_TOKEN
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"

      # This IS the gate. Every workspace package's check/test, every
      # cross-cutting tool script, and the real end-to-end facts-bundle proof
      # — see tools/gate-all.mjs's own header for the full list. It never
      # short-circuits on the first failure, so one CI run shows the whole
      # picture.
      - name: gate-all
        run: node tools/gate-all.mjs
