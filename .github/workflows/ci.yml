name: CI

# Root workspace gate — fixes finding 1.1 (no root CI at all). This is the
# canonical, automatic enforcement point: it runs `node tools/gate-all.mjs`,
# "the ONE command that proves the whole workspace is green" (see that file's
# own header). Every per-package `.github/workflows/ci.yml` is manual-dispatch
# only and exists as a mirror-side backstop (see those files' own headers) —
# this is the workflow that actually runs on every push/PR against the
# monorepo, closing the gap documented in
# docs/plans/2026-08-17-standalone-repo-realignment.md (the 2026-08-12→17
# mirror-fork incident happened with no CI catching it).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  gate-all:
    name: gate-all (the whole workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.30.3"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Installs npm deps for every workspace package, then (via the root
      # `postinstall` -> tools/install-toolchains.mjs) runs `elm-tooling
      # install` for the root and for every package that ships its own
      # elm-tooling.json. See that script's header for why elm-cem and
      # elm-review-cem are intentionally excluded from that pass.
      - name: Install workspace deps (+ toolchains via postinstall)
        run: pnpm install --frozen-lockfile

      # Public repo, no auth needed — required by check-mirror-drift for the
      # names already recorded in tools/publish-mirror-state.json.
      - name: Point gh CLI at GITHUB_TOKEN
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"

      # REQUIRE_CLONE_GATES=1 below (see the gate-all step) turns the
      # docs-pipeline "SKIP" fallback in check-review-guard.mjs /
      # check-nav.mjs / check-data-drift.mjs / browser-guard.mjs into a hard
      # failure. Only check-review-guard.mjs self-provisions (it runs its own
      # `elm-pages gen` before elm-review). The other three need
      # docs/data/reference.json, which `pnpm install` alone does NOT
      # produce — that's a separate `pnpm gen` pipeline. Measured locally:
      # ~25s, deterministic, safe to run unconditionally in CI. Without this
      # step, REQUIRE_CLONE_GATES=1 flips CI red for elm-m3e's check:nav and
      # check:drift even though nothing is actually broken — that would be
      # noise, not signal, defeating the point of D2. See
      # docs/plans/2026-08-19-durable-m3e-convention-enforcement.md D2.
      - name: Generate docs pipeline (m3e-builder-docs) inputs
        run: pnpm --filter m3e-builder-docs run gen

      # browser-guard.mjs's own precondition check only verifies
      # node_modules/.bin/playwright exists (present after plain `pnpm
      # install`, since @playwright/test ships that bin script) — the actual
      # Chromium ENGINE binary is a separate download this step provides.
      # Without it, test:browser would still hard-fail under
      # REQUIRE_CLONE_GATES=1 at browser-launch time instead of at the guard.
      # Only chromium is used (playwright.config.ts's sole project).
      - name: Install Playwright Chromium
        working-directory: packages/elm-m3e/docs
        run: npx playwright install --with-deps chromium

      # This IS the gate. Every workspace package's check/test, every
      # cross-cutting tool script, and the real end-to-end facts-bundle proof
      # — see tools/gate-all.mjs's own header for the full list. It never
      # short-circuits on the first failure, so one CI run shows the whole
      # picture.
      - name: gate-all
        run: node tools/gate-all.mjs
        env:
          REQUIRE_CLONE_GATES: "1"
