<!DOCTYPE html>
<html>
<head><meta charset="utf-8" />
<!--
  Adapted from avetta/akg-synapse VSD plugin, itself adapted from
  cursor-talk-to-figma-mcp (sonnylazuardi, MIT).

  Bridge-only UI panel: joins extract/relay/socket.ts on the channel code.js
  assigned, relays bridge-cmd / bridge-result messages between the WebSocket
  and the plugin sandbox (postMessage). No dump/export UI — this plugin has
  exactly one job. See extract/README.md for the runbook.
-->
<style>
  body { font: 12px -apple-system, sans-serif; margin: 0; padding: 12px; color: #111; }
  h3 { margin: 0 0 8px; font-size: 13px; }
  #bridge-status { background: #f3f4f6; border-radius: 6px; padding: 10px; font-family: ui-monospace, monospace; font-size: 11px; margin-bottom: 8px; }
  #bridge-log { font-family: ui-monospace, monospace; font-size: 10px; color: #6b7280; height: 90px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-end; }
  label { flex: 1; font-size: 11px; color: #6b7280; }
  input, button { font: 12px ui-monospace, monospace; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; width: 100%; }
  button { background: #0d99ff; color: #fff; font-weight: 600; cursor: pointer; border: 0; flex: 0 0 auto; width: auto; }
  .hint { color: #6b7280; margin-top: 6px; font-size: 11px; }
  .badge-connected { color: #15803d; font-weight: 700; }
  .badge-error { color: #dc2626; }
</style></head>
<body>
  <h3>cem-figma-connect Extract Bridge</h3>
  <div class="row">
    <label>channel<br>
      <input id="bridge-channel" type="text" value="" />
    </label>
    <button id="bridge-connect">Reconnect</button>
  </div>
  <div id="bridge-status">connecting…</div>
  <div id="bridge-log"></div>
  <div class="hint">
    Keep this panel open while <code>extract/export.mjs</code> runs. Relay:
    <code>bun extract/relay/socket.ts</code> (port <code>3055</code>).
  </div>
<script>
function genId() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

let ws = null;
let bridgeChannel = "";
let bridgeMeta = {};   // {editorType, fileName} from code.js — travels with the join
  // so a caller's discovery step can pick the writable bridge.
const WS_URL = "ws://localhost:3055";

function bridgeLog(line) {
  const el = document.getElementById("bridge-log");
  if (!el) return;
  const ts = new Date().toLocaleTimeString();
  el.textContent = `[${ts}] ${line}\n` + (el.textContent || "").slice(0, 800);
}

function startBridge(channel) {
  bridgeChannel = channel;
  const statusEl = document.getElementById("bridge-status");
  bridgeLog("connecting " + WS_URL);
  if (statusEl) statusEl.textContent = "connecting to " + WS_URL + "…";

  let sock;
  try { sock = new WebSocket(WS_URL); } catch (e) {
    bridgeLog("constructor threw: " + e.message);
    if (statusEl) statusEl.innerHTML = '<span class="badge-error">✗ WS constructor failed</span>';
    return;
  }
  ws = sock;

  sock.onopen = () => {
    // role:"bridge" + meta lets the relay enforce single-bridge-per-channel
    // and lets a caller's discovery step pick the writable (editorType
    // "figma") bridge.
    sock.send(JSON.stringify({ type: "join", channel, role: "bridge", meta: bridgeMeta, id: genId() }));
    if (statusEl) statusEl.textContent = "joining channel '" + channel + "'…";
  };

  sock.onmessage = (event) => {
    let msg; try { msg = JSON.parse(event.data); } catch (e) { return; }
    if (msg.type === "system" && typeof msg.message === "string" && msg.message.startsWith("Joined")) {
      if (statusEl) statusEl.innerHTML = '<span class="badge-connected">✓ connected</span> · channel: ' + channel;
      bridgeLog("joined channel '" + channel + "'");
      return;
    }
    // Relay refused: another live bridge already owns this channel.
    if (msg.type === "channel_busy") {
      if (statusEl) statusEl.innerHTML = '<span class="badge-error">✗ channel busy</span> — ' + (msg.message || "another bridge owns this channel");
      bridgeLog("channel '" + channel + "' busy — close the other plugin instance, or change the channel + Reconnect");
      return;
    }
    if (msg.type === "broadcast" && msg.message) {
      const payload = msg.message;
      if (payload.type === "command_progress" || payload.commandType || payload.status) return;
      if (!payload.command) return;
      bridgeLog("← " + payload.command + " (id:" + (payload.id || "").slice(0, 8) + ")");
      parent.postMessage({ pluginMessage: { type: "bridge-cmd", id: payload.id, command: payload.command, params: payload.params || {} } }, "*");
    }
  };

  sock.onerror = () => {
    bridgeLog("error on " + WS_URL);
    if (statusEl) statusEl.innerHTML = '<span class="badge-error">✗ WS error — relay not reachable. Start it: bun extract/relay/socket.ts</span>';
  };

  sock.onclose = () => {
    if (statusEl) statusEl.innerHTML = '<span class="badge-error">✗ disconnected</span> — close and re-run "Start WS Bridge" to reconnect';
    bridgeLog("disconnected");
  };
}

function reconnectBridge() {
  const channel = document.getElementById("bridge-channel").value || bridgeChannel;
  if (ws) {
    try { ws.onopen = ws.onmessage = ws.onerror = ws.onclose = null; ws.close(); } catch (e) {}
    ws = null;
  }
  bridgeLog("connecting channel '" + channel + "'");
  startBridge(channel);
}

onmessage = (e) => {
  const msg = e.data.pluginMessage;
  if (!msg) return;

  // code.js self-assigned a RANDOM channel (cem-<hex>) and passed
  // editorType/fileName. Stash the meta for the join, prefill the channel
  // input, then auto-connect.
  if (msg.command === "bridge") {
    bridgeMeta = msg.meta || {};
    document.getElementById("bridge-channel").value = msg.channel || "";
    reconnectBridge();
    return;
  }

  // Bridge result from code.js → send back over the WS to the caller.
  if (msg.type === "bridge-result") {
    bridgeLog("→ result for id:" + (msg.id || "").slice(0, 8) + (msg.error ? " ERROR" : " OK"));
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({
        type: "message",
        channel: bridgeChannel,
        id: genId(),
        message: { id: msg.id, result: msg.result, error: msg.error },
      }));
    }
    return;
  }
};

document.getElementById("bridge-connect").onclick = reconnectBridge;

// Signal plugin code that the UI iframe is ready to receive postMessage calls.
parent.postMessage({ pluginMessage: { type: "ui-ready" } }, "*");
</script>
</body>
</html>
