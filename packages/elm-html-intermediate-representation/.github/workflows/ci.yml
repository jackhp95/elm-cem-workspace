name: CI

# MANUAL ONLY — `hooks/pre-push` runs this repo's gate locally before anything
# reaches origin, so re-running it here is a slower duplicate. Kept dispatchable
# for a clean-checkout or ubuntu-vs-macOS reproduction.
on:
  workflow_dispatch:

env:
  ELM_VERSION: "0.19.1"
  NODE_VERSION: "22"

jobs:
  ci:
    name: gate (format · review · validate · acid · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache elm-stuff
        uses: actions/cache@v4
        with:
          path: elm-stuff
          key: ${{ runner.os }}-elm-${{ env.ELM_VERSION }}-${{ hashFiles('elm.json') }}

      - name: Cache review elm-stuff
        uses: actions/cache@v4
        with:
          path: review/elm-stuff
          key: ${{ runner.os }}-elm-review-${{ hashFiles('review/elm.json', 'review/src/**/*.elm') }}

      - name: Install deps
        run: npm ci

      # One step, deliberately (finding 1.8 fix): `gate` = `run-s check test`,
      # i.e. every check:* script (format/review/validate/acid) THEN the
      # elm-test-rs suite. This workflow used to hand-enumerate only three of
      # the four check:* steps and never ran `test` at all — silently stale
      # the moment check:acid was added and test suite grew. `gate` is also
      # what hooks/pre-push runs locally; enumerating steps again here would
      # let this file drift from package.json a second time.
      - name: gate (check:* then test)
        run: npm run gate
