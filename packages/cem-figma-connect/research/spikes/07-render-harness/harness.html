<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>m3e render harness</title>
<style>
  /* Local Roboto — no network fetches. M3e components use font-family: inherit,
     so the host font-family below is what drives component text rendering. */
  @font-face {
    font-family: "Roboto";
    font-style: normal;
    font-weight: 400;
    font-display: block;
    src: url("./assets/roboto-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Roboto";
    font-style: normal;
    font-weight: 500;
    font-display: block;
    src: url("./assets/roboto-latin-500-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Roboto";
    font-style: normal;
    font-weight: 700;
    font-display: block;
    src: url("./assets/roboto-latin-700-normal.woff2") format("woff2");
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent; /* transparent background for omitBackground screenshots */
  }
  body {
    font-family: "Roboto", sans-serif;
    font-synthesis: none; /* never fake weights — fail loudly if a weight is missing */
    -webkit-font-smoothing: antialiased;
  }

  /* Belt-and-braces animation kill switch (light DOM + inheritable bits).
     Shadow-DOM transitions are handled by Playwright's animations:'disabled'
     plus the reducedMotion:'reduce' context option (m3e checks prefers-reduced-motion). */
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
    caret-color: transparent !important;
  }

  #stage {
    display: inline-block; /* shrink-wrap the component */
    padding: 8px;          /* breathing room so shadows/focus rings aren't clipped */
  }
</style>
<script type="module" src="./assets/m3e-all.bundle.js"></script>
</head>
<body>
<div id="stage"></div>
<script type="module">
  // Drive the mounted element from query params so any element/variant works:
  //   ?tag=m3e-button&attrs=variant:filled,disabled&text=Label
  // attrs is a comma-separated list of name:value pairs; a bare name is a
  // boolean attribute. Values are URI-decoded so ":" and "," can be escaped.
  const params = new URLSearchParams(location.search);
  const tag = params.get("tag") ?? "m3e-button";
  const attrs = params.get("attrs") ?? "";
  const text = params.get("text") ?? "";

  const el = document.createElement(tag);
  for (const pair of attrs.split(",").filter(Boolean)) {
    const i = pair.indexOf(":");
    if (i === -1) {
      el.setAttribute(pair.trim(), "");
    } else {
      el.setAttribute(pair.slice(0, i).trim(), decodeURIComponent(pair.slice(i + 1)));
    }
  }
  if (text) el.textContent = text;
  document.getElementById("stage").appendChild(el);

  // Readiness signal for the test: element defined + upgraded + fonts loaded
  // + two RAFs so lit has committed its first render.
  window.__ready = (async () => {
    await customElements.whenDefined(tag);
    await document.fonts.ready;
    if (el.updateComplete) await el.updateComplete;
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    return true;
  })();
</script>
</body>
</html>
