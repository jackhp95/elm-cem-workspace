packages:
  - "packages/_probe/*"
  - "packages/*"
  - "pipeline/*"
  - "brands/*/inputs/*"
  - "brands/*/inputs/*/*"
  - "brands/*/generated/*/*"
  - "brands/*/generated/*/*/*"
  - "!**/node_modules"
  - "!**/elm-stuff"
  - "!pipeline/*/elm-virtual-dom-intermediate-representation"
  # docs-gen is a Phase-N skeleton (brand-agnostic docs generator, WIP): excluded
  # from the workspace/gate graph until its route-generation layer lands and a
  # brand actually consumes it. Its parity tests run standalone (node --test).
  - "!pipeline/docs-gen"

allowBuilds:
  '@parcel/watcher': true
  elm: true
  elm-format: true
  esbuild: true
  lamdera: true

minimumReleaseAgeExclude:
  - '@m3e/web@2.5.13'
