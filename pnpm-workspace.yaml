packages:
  - "packages/_probe/*"
  - "packages/*"
  - "pipeline/*"
  - "brands/*/inputs/*"
  - "brands/*/inputs/*/*"
  - "brands/*/generated/*/*"
  - "brands/*/generated/*/*/*"
  - "!**/node_modules"
  - "!**/elm-stuff"
  - "!pipeline/*/elm-virtual-dom-intermediate-representation"

allowBuilds:
  '@parcel/watcher': true
  elm: true
  elm-format: true
  esbuild: true
  lamdera: true

minimumReleaseAgeExclude:
  - '@m3e/web@2.5.13'
